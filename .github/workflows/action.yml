# Visit https://github.com/lowlighter/metrics/blob/master/action.yml for full reference
name: Metrics
on:
  # Schedule updates (daily)
  schedule: [{cron: "0 0 * * *"}]
  # Lines below let you run workflow manually and on each commit
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    # The forked action builds its Docker image on every run
    timeout-minutes: 30
    environment:
      name: production
    permissions:
      contents: write
    steps:
      # Fork of gh-metrics/metrics that accepts fine-grained tokens
      - uses: eljobe/metrics@26a11208dad5109fa98b448143d0028dedd79236 # gh-metrics-base
        with:
          # Your GitHub token
          # The following scopes are required:
          #  - public_access (default scope)
          #  - repo
          # The following additional scopes may be required:
          #  - read:org  (for organization related metrics)
          #  - read:user (for user related data)
          #  - repo      (optional, if you want to include private repositories)
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: eljobe
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Zurich
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_ignored: explorer, gister, helper
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          plugin_isocalendar: no
          plugin_traffic: yes
          plugin_languages: yes
          plugin_stackoverflow: yes
          plugin_stackoverflow_user: 95724
          plugin_followup: yes
          plugin_followup_indepth: yes
